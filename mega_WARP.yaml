    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/discord.yaml
    path: ./ruleset/discord.yaml
    interval: 86400
  discord-ip:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/discord-cidr.yaml
    path: ./ruleset/discord-cidr.yaml
    interval: 86400
  youtube:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/youtube.yaml
    path: ./ruleset/youtube.yaml
    interval: 86400
  ai:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/ai.yaml
    path: ./ruleset/ai_list.yaml
    interval: 86400
  meta:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/meta.yaml
    path: ./ruleset/meta.yaml
    interval: 86400
  twitter:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/twitter.yaml
    path: ./ruleset/twitter.yaml
    interval: 86400
  netflix:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/netflix.yaml
    path: ./ruleset/netflix.yaml
    interval: 86400
  tiktok:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/tiktok.yaml
    path: ./ruleset/tiktok.yaml
    interval: 86400
  torrent:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/torrent.yaml
    path: ./ruleset/torrent.yaml
    interval: 86400
  games:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/codelabhq/clash-warp-config/main/ruleset/games.yaml
    path: ./ruleset/games.yaml
    interval: 86400
  HODCA:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Categories/hodca.lst
    path: ./ruleset/hodca.lst
    interval: 86400
  category-ru:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/category-ru.mrs
    path: ./ruleset/category-ru.mrs
    interval: 86400
  whitelist:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs
    path: ./ruleset/whitelist.mrs
    interval: 86400
  private-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/private.mrs
    path: ./ruleset/geosite-private.mrs
    interval: 86400
  private-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip/release/mihomo/private.mrs
    path: ./ruleset/geoip-private.mrs
    interval: 2592000
  direct-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip/release/mihomo/direct.mrs
    path: ./ruleset/direct-ips.mrs
    interval: 86400

rules:
  - RULE-SET,private-ips,DIRECT,no-resolve
