  - RULE-SET,category-ru,DIRECT
  - RULE-SET,whitelist,DIRECT
  - RULE-SET,direct-ips,DIRECT,no-resolve
  - DOMAIN-SUFFIX,telegram.org,WARP
  - DOMAIN-SUFFIX,t.me,WARP
  - DOMAIN-SUFFIX,telegram.me,WARP
  - DOMAIN-SUFFIX,telegram.dog,WARP
  - DOMAIN-SUFFIX,telegra.ph,WARP
  - DOMAIN-SUFFIX,telesco.pe,WARP
  - DOMAIN-SUFFIX,tg.dev,WARP
  - DOMAIN-SUFFIX,adserver.twitch.tv,REJECT
  - DOMAIN-SUFFIX,ads.twitch.tv,REJECT
  - DOMAIN-KEYWORD,twitch-ads,REJECT
  - DOMAIN-SUFFIX,usher.ttvnw.net,WARP
  - DOMAIN-SUFFIX,gql.twitch.tv,WARP
  - DOMAIN-SUFFIX,twitch.tv,DIRECT
  - DOMAIN-SUFFIX,ttvnw.net,DIRECT
  - DOMAIN-SUFFIX,jtvnw.net,DIRECT
  - RULE-SET,youtube,WARP
  - RULE-SET,discord,WARP
  - RULE-SET,ai,WARP
  - RULE-SET,meta,WARP
  - RULE-SET,twitter,WARP
  - RULE-SET,tiktok,WARP
  - RULE-SET,netflix,WARP
  - RULE-SET,torrent,WARP
  - RULE-SET,games,WARP
  - RULE-SET,HODCA,WARP
  - DOMAIN-SUFFIX,googleapis.com,DIRECT
  - DOMAIN-SUFFIX,gstatic.com,DIRECT
  - DOMAIN-SUFFIX,google.com,DIRECT
  - DOMAIN-KEYWORD,chrome,DIRECT
  - AND,((NETWORK,udp),(RULE-SET,discord-ip)),WARP
  - MATCH,WARP
